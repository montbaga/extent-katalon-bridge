# Extent-Katalon Bridge configuration
# ------------------------------------------------------------------
# Every key here can be overridden without touching this file by setting
# an environment variable named EXTENT_<KEY_IN_UPPER_SNAKE_CASE>, e.g.
#   extent.results.dir       -> EXTENT_RESULTS_DIR
#   extent.enabled           -> EXTENT_ENABLED
# This lets each CI environment (Jenkins, Azure Pipelines, local dev)
# point results wherever it needs to without forking this file.

# Master switch. Set to false to disable Extent reporting entirely
# (e.g. for a quick local debug run) without removing the listener.
extent.enabled=true

# Where intermediate per-test-case JSON records are written before being
# assembled into the final HTML report. Relative paths are resolved
# against the Katalon project root. Nothing here is meant to be read
# directly - it's this bridge's own working storage.
extent.results.dir=extent-results

# true (default): delete this folder's leftover intermediate records from
# an earlier, unrelated run before writing new ones, so each generated
# report reflects only the run it's named after. Does NOT clear between
# the Test Suites of one Test Suite Collection run (they all share the
# same Reports/<timestamp> folder, which is how a "new run" is detected) -
# those are meant to combine into one report. Set to false if you run
# multiple *unrelated* suites in true parallel against this same folder -
# a suite starting mid-run could otherwise wipe another suite's
# still-in-progress results.
extent.clean.results.before.run=true

# Attach a screenshot automatically when a test case does NOT pass.
# Only takes effect if a WebUI browser session is active; silently
# skipped for API/Mobile-only test cases.
extent.attach.screenshot.on.failure=true

# Attach a screenshot for every test case, pass or fail. Off by default
# because it bloats the generated report on large WebUI suites (screenshots
# are embedded inline as base64, not linked as separate files).
extent.attach.screenshot.always=false

# Path (relative to project root, or absolute) to the categories.json
# template that classifies failures - matched against each failed/broken
# test case's message and stack trace, then applied via Extent's own tag
# system (assignCategory), visible in the report's Categories/Tags view.
extent.categories.file=Include/config/extent/categories.json

# Automatically assemble the HTML report at the end of every suite, so a
# finished report is already sitting on disk with no extra step. Needs no
# external commandline tool - report generation happens in-process, using
# the bundled Extent Reports jars. Set to false if you'd rather assemble
# the report yourself later from the raw records left in
# extent.results.dir (e.g. a custom CI aggregation step).
extent.auto.generate.report=true

# Base folder the HTML report is written under. Each run gets its own
# "<Name>_<yyyyMMdd_HHmmss>/" folder here (mirrors Katalon's own
# Reports/<timestamp>/<SuiteName> naming) so repeated runs don't overwrite
# each other. <Name> is a Test Suite Collection's name if you ran one,
# otherwise the Test Suite's name, or a lone Test Case's own name if run
# directly without a saved suite. The report only generates once every
# suite in the current run has finished (not progressively as each one
# does), and a Test Suite Collection produces exactly one combined report,
# not one per Test Suite. Relative paths are resolved against the Katalon
# project root.
extent.report.dir=extent-report

# "standard" (default) or "dark" - the Spark report's colour theme.
extent.report.theme=standard

# true (default): automatically turn each test case's own Katalon
# execution log (every keyword/script line it already records, complete
# with pass/fail per line) into nested Extent log steps - no test script
# changes needed. This reads an already-written, already-closed log file
# per test case, so it can never affect the actual test outcome. Turn off
# for very large/slow suites if the extra per-test-case parsing overhead
# isn't worth it, or if you only want the manual ExtentKeywords.step()
# calls you've explicitly added in your scripts.
extent.capture.steps=true
