<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Extent-Katalon Bridge lifecycle from ExtentTestListener to standalone HTML">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="12" y="10" width="1176" height="200" rx="16" fill="#ebeff9" stroke="#c4cde3" stroke-width="1.2"/>
  <text x="32" y="34" class="mono" font-size="10.5" letter-spacing="1.2" fill="#4f5b75">IN-PROCESS EXTENT ENGINE &amp; STEP CONVERSION</text>
  <text x="1168" y="34" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.0" fill="#4f5b75">4 JARS IN DRIVERS/ · NEVER SHELLS OUT</text>

  <rect x="28" y="52" width="224" height="136" rx="12" fill="#ffffff" stroke="#ccd4e8"/>
  <rect x="44" y="67" width="38" height="20" rx="5" fill="#e6ebf7"/>
  <text x="63" y="81" text-anchor="middle" class="mono" font-size="10.5" fill="#0f1526">01</text>
  <text x="44" y="108" class="sans" font-size="15.5" font-weight="700" fill="#0f1526">ExtentTestListener</text>
  <text x="44" y="129" class="sans" font-size="11.5" fill="#445069">Auto-discovered by Katalon;</text>
  <text x="44" y="146" class="sans" font-size="11.5" fill="#445069">hooks suite, test &amp; WebUI</text>
  <text x="44" y="163" class="sans" font-size="11.5" fill="#445069">inline failure capture.</text>

  <line x1="252" y1="120" x2="292" y2="120" stroke="#99a5c2" stroke-width="2" stroke-dasharray="4 4"/>
  <circle r="3.8" fill="#4f46e5">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M254,120 L290,120"/>
  </circle>

  <rect x="292" y="52" width="234" height="136" rx="12" fill="#ffffff" stroke="#ccd4e8"/>
  <rect x="308" y="67" width="38" height="20" rx="5" fill="#e6ebf7"/>
  <text x="327" y="81" text-anchor="middle" class="mono" font-size="10.5" fill="#0f1526">02</text>
  <text x="308" y="108" class="sans" font-size="15.5" font-weight="700" fill="#0f1526">Logs &amp; Categories</text>
  <text x="308" y="129" class="sans" font-size="11.5" fill="#445069">Parses Katalon XML logs</text>
  <text x="308" y="146" class="sans" font-size="11.5" fill="#445069">into nested steps &amp; matches</text>
  <text x="308" y="163" class="sans" font-size="11.5" fill="#445069">categories.json patterns.</text>

  <line x1="526" y1="120" x2="566" y2="120" stroke="#4f46e5" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="4 4"/>
  <circle r="4" fill="#4f46e5">
    <animateMotion dur="1.8s" begin="0.45s" repeatCount="indefinite" path="M528,120 L564,120"/>
  </circle>

  <rect x="566" y="48" width="258" height="144" rx="13" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="582" y="63" width="136" height="20" rx="5" fill="#ecebff"/>
  <text x="650" y="77" text-anchor="middle" class="mono" font-size="9.5" fill="#4338ca">03 · EXTENT SPARK 5.1.2</text>
  <text x="582" y="106" class="sans" font-size="16" font-weight="700" fill="#0f1526">ExtentReportBridge</text>
  <text x="582" y="127" class="sans" font-size="11.5" fill="#3a455e">Reads EXTENT_* env vars;</text>
  <text x="582" y="144" class="sans" font-size="11.5" fill="#3a455e">renders Spark HTML via</text>
  <text x="582" y="161" class="sans" font-size="11.5" fill="#3a455e">bundled FreeMarker &amp; Rx.</text>
  <text x="582" y="180" class="mono" font-size="9.2" fill="#4338ca">ZERO EXTERNAL CLI TOOLS</text>

  <path d="M824,90 C852,90 854,70 884,70" fill="none" stroke="#118a52" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="4 4"/>
  <path d="M824,120 L884,120" fill="none" stroke="#4f46e5" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="4 4"/>
  <path d="M824,150 C852,150 854,170 884,170" fill="none" stroke="#d94e14" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="4 4"/>

  <circle r="3.4" fill="#118a52"><animateMotion dur="2s" repeatCount="indefinite" path="M824,90 C852,90 854,70 884,70"/></circle>
  <circle r="3.4" fill="#4f46e5"><animateMotion dur="2s" begin="0.3s" repeatCount="indefinite" path="M824,120 L884,120"/></circle>
  <circle r="3.4" fill="#d94e14"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M824,150 C852,150 854,170 884,170"/></circle>

  <rect x="884" y="48" width="288" height="44" rx="9" fill="#f3fbf7" stroke="#9bd9bb"/>
  <rect x="896" y="60" width="84" height="20" rx="5" fill="#dcf4e8"/>
  <text x="938" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#0f7846">INDEX.HTML</text>
  <text x="990" y="67" class="sans" font-size="12" font-weight="700" fill="#0f1526">Combined Run Report</text>
  <text x="990" y="83" class="sans" font-size="10.5" fill="#445069">Suites sorted + multi-browser</text>

  <rect x="884" y="98" width="288" height="44" rx="9" fill="#f4f3ff" stroke="#c3c0f7"/>
  <rect x="896" y="110" width="84" height="20" rx="5" fill="#e6e4fc"/>
  <text x="938" y="124" text-anchor="middle" class="mono" font-size="9.5" fill="#4338ca">THEMES</text>
  <text x="990" y="117" class="sans" font-size="12" font-weight="700" fill="#0f1526">Standard / Dark Theme</text>
  <text x="990" y="133" class="sans" font-size="10.5" fill="#445069">Inline screenshots &amp; logs</text>

  <rect x="884" y="148" width="288" height="44" rx="9" fill="#fff7f3" stroke="#f2b8a2"/>
  <rect x="896" y="160" width="84" height="20" rx="5" fill="#fde5dc"/>
  <text x="938" y="174" text-anchor="middle" class="mono" font-size="9.5" fill="#c2400c">SYSTEM INFO</text>
  <text x="990" y="167" class="sans" font-size="12" font-weight="700" fill="#0f1526">CI Auto-Detected</text>
  <text x="990" y="183" class="sans" font-size="10.5" fill="#445069">Win / macOS / Linux + Jenkins</text>
</svg>
