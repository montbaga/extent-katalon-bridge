<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-label="Five capabilities built into Extent-Katalon Bridge">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="12" y="10" width="1176" height="156" rx="16" fill="#0d1221" stroke="#25304d" stroke-width="1.2"/>
  <text x="32" y="35" class="mono" font-size="10.5" letter-spacing="1.2" fill="#8896b3">FIVE WAYS IT REPLACES THE OFFICIAL PLUGIN  ·  VERIFIED WIN / MAC / LINUX CI</text>
  <text x="1168" y="35" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.0" fill="#8896b3">NO OSGI · ACTIVELY MAINTAINED</text>

  <rect x="28" y="48" width="216" height="104" rx="11" fill="#131a30" stroke="#273454"/>
  <rect x="44" y="61" width="84" height="19" rx="5" fill="#1c2042" stroke="#818cf8" stroke-opacity="0.5"/>
  <text x="86" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#a5b4fc">01 · NO STORE</text>
  <circle cx="226" cy="70" r="3.5" fill="#818cf8">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Zero Store Plugin</text>
  <text x="44" y="118" class="sans" font-size="11.2" fill="#a2afc7">Ships 4 tested JARs +</text>
  <text x="44" y="134" class="sans" font-size="11.2" fill="#a2afc7">pre-wired listener directly.</text>

  <rect x="258" y="48" width="216" height="104" rx="11" fill="#131a30" stroke="#273454"/>
  <rect x="274" y="61" width="76" height="19" rx="5" fill="#142b23" stroke="#3dd98f" stroke-opacity="0.5"/>
  <text x="312" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#3dd98f">02 · STEPS</text>
  <circle cx="456" cy="70" r="3.5" fill="#3dd98f">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="274" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Auto Step Tree</text>
  <text x="274" y="118" class="sans" font-size="11.2" fill="#a2afc7">Converts execution logs</text>
  <text x="274" y="134" class="sans" font-size="11.2" fill="#a2afc7">with zero attachLog() calls.</text>

  <rect x="488" y="48" width="216" height="104" rx="11" fill="#131a30" stroke="#273454"/>
  <rect x="504" y="61" width="76" height="19" rx="5" fill="#2e1c16" stroke="#ff7b3b" stroke-opacity="0.5"/>
  <text x="542" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#ff9666">03 · TAGS</text>
  <circle cx="686" cy="70" r="3.5" fill="#ff7b3b">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="504" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Categories JSON</text>
  <text x="504" y="118" class="sans" font-size="11.2" fill="#a2afc7">Auto-tags timeouts, OR,</text>
  <text x="504" y="134" class="sans" font-size="11.2" fill="#a2afc7">&amp; assertion failures.</text>

  <rect x="718" y="48" width="216" height="104" rx="11" fill="#131a30" stroke="#273454"/>
  <rect x="734" y="61" width="84" height="19" rx="5" fill="#15283d" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="776" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#7dd3fc">04 · SHOTS</text>
  <circle cx="916" cy="70" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="734" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Inline Screenshots</text>
  <text x="734" y="118" class="sans" font-size="11.2" fill="#a2afc7">WebUI captures embedded;</text>
  <text x="734" y="134" class="sans" font-size="11.2" fill="#a2afc7">standard or dark theme.</text>

  <rect x="948" y="48" width="216" height="104" rx="11" fill="#131a30" stroke="#273454"/>
  <rect x="964" y="61" width="84" height="19" rx="5" fill="#2b2314" stroke="#ffc857" stroke-opacity="0.5"/>
  <text x="1006" y="74" text-anchor="middle" class="mono" font-size="9.5" fill="#ffc857">05 · SAFE</text>
  <circle cx="1146" cy="70" r="3.5" fill="#ffc857">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.0s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="964" y="99" class="sans" font-size="14" font-weight="700" fill="#ece6da">Actively Maintained</text>
  <text x="964" y="118" class="sans" font-size="11.2" fill="#a2afc7">Safe hooks; works around</text>
  <text x="964" y="134" class="sans" font-size="11.2" fill="#a2afc7">upstream Extent 5 quirks.</text>
</svg>
