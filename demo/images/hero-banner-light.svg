<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="Extent-Katalon Bridge — zero-touch Extent Reports 5 HTML for Katalon Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f4fb"/>
      <stop offset="55%" stop-color="#e9edf8"/>
      <stop offset="100%" stop-color="#dfe6f5"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0.72" cy="0.46" r="0.56">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f2f4fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3dd98f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#11182c" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip"><rect x="16" y="16" width="1168" height="338" rx="18"/></clipPath>
    <clipPath id="termClip"><rect x="610" y="33" width="546" height="304" rx="12"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', Times, serif; font-style: italic; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="16" y="16" width="1168" height="338" rx="18" fill="url(#bg)"/>
    <rect x="16" y="16" width="1168" height="338" fill="url(#grid)"/>
    <rect x="16" y="16" width="1168" height="338" fill="url(#glowIndigo)"/>

    <!-- Status pill -->
    <rect x="52" y="42" width="346" height="24" rx="12" fill="#11182c"/>
    <circle cx="67" cy="54" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="58" class="mono" font-size="10.5" letter-spacing="1.0" fill="#f2f4fb">IN-PROCESS EXTENT 5 · ZERO STORE PLUGINS</text>

    <!-- Extent Spark Emblem -->
    <g>
      <rect x="52" y="88" width="54" height="54" rx="14" fill="#11182c" stroke="#4f46e5" stroke-opacity="0.8" stroke-width="1.3"/>
      <circle cx="79" cy="115" r="17" fill="none" stroke="#2a3556" stroke-width="3.2"/>
      <circle cx="79" cy="115" r="17" fill="none" stroke="#3dd98f" stroke-width="3.2" stroke-dasharray="68 40" stroke-linecap="round" transform="rotate(-90 79 115)"/>
      <circle cx="79" cy="115" r="17" fill="none" stroke="#ff6b6b" stroke-width="3.2" stroke-dasharray="22 86" stroke-dashoffset="-74" stroke-linecap="round" transform="rotate(-90 79 115)"/>
      <text x="79" y="120" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#ece6da">E5</text>
    </g>

    <text x="118" y="130" class="sans" font-size="37" font-weight="700" letter-spacing="-1.0" fill="#0f1526">Extent-Katalon Bridge</text>
    <text x="52" y="180" class="serif" font-size="25.5" fill="#4338ca">zero-touch Extent 5 Spark reports</text>

    <text x="52" y="218" class="sans" font-size="14" fill="#3a455e">In-process Extent HTML with auto-converted steps, failure tags,</text>
    <text x="52" y="240" class="sans" font-size="14" fill="#3a455e">and inline screenshots — zero manual attachLog() calls required.</text>

    <rect x="52" y="268" width="128" height="30" rx="8" fill="#ffffff" stroke="#c7d0e6"/>
    <text x="116" y="287" text-anchor="middle" class="mono" font-size="10.5" fill="#0f1526">EXTENT 5.1.2</text>

    <rect x="192" y="268" width="136" height="30" rx="8" fill="#ffffff" stroke="#c7d0e6"/>
    <text x="260" y="287" text-anchor="middle" class="mono" font-size="10.5" fill="#0f1526">AUTO LOG STEPS</text>

    <rect x="340" y="268" width="138" height="30" rx="8" fill="#ffffff" stroke="#c7d0e6"/>
    <text x="409" y="287" text-anchor="middle" class="mono" font-size="10.5" fill="#0f1526">STANDARD / DARK</text>

    <text x="52" y="331" class="mono" font-size="10.5" letter-spacing="0.8" fill="#4f5b75">IN-PROCESS JARS  ·  EXECUTION LOG PARSER  ·  CROSS-PLATFORM CI</text>

    <!-- Right Monitor -->
    <rect x="610" y="33" width="546" height="304" rx="12" fill="#0d1221" stroke="#263152" stroke-width="1.2"/>
    <g clip-path="url(#termClip)">
      <rect x="610" y="33" width="546" height="32" fill="#131a30"/>
      <circle cx="630" cy="49" r="4.5" fill="#ff7b3b"/>
      <circle cx="645" cy="49" r="4.5" fill="#ffc857"/>
      <circle cx="660" cy="49" r="4.5" fill="#3dd98f"/>
      <text x="680" y="53" class="mono" font-size="10.5" letter-spacing="0.9" fill="#9fb0d0">EXTENT SPARK 5.1.2 · LIVE REPORT VIEW</text>
      <rect x="944" y="43" width="7" height="12" rx="1" fill="#818cf8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <rect x="630" y="78" width="158" height="92" rx="8" fill="#131a30" stroke="#232f4f"/>
      <text x="644" y="96" class="mono" font-size="9.5" fill="#9fb0d0">TESTS</text>
      <circle cx="670" cy="130" r="22" fill="none" stroke="#ff6b6b" stroke-width="6"/>
      <circle cx="670" cy="130" r="22" fill="none" stroke="#3dd98f" stroke-width="6" stroke-dasharray="88 55" transform="rotate(-90 670 130)"/>
      <text x="706" y="126" class="sans" font-size="12" font-weight="700" fill="#3dd98f">5 passed</text>
      <text x="706" y="143" class="sans" font-size="11" fill="#ff8787">3 failed</text>

      <rect x="802" y="78" width="158" height="92" rx="8" fill="#131a30" stroke="#232f4f"/>
      <text x="816" y="96" class="mono" font-size="9.5" fill="#9fb0d0">STEPS</text>
      <circle cx="842" cy="130" r="22" fill="none" stroke="#ff6b6b" stroke-width="6"/>
      <circle cx="842" cy="130" r="22" fill="none" stroke="#3dd98f" stroke-width="6" stroke-dasharray="130 12" transform="rotate(-90 842 130)"/>
      <text x="878" y="126" class="sans" font-size="12" font-weight="700" fill="#3dd98f">106 steps</text>
      <text x="878" y="143" class="sans" font-size="11" fill="#9fb0d0">3 failed</text>

      <rect x="974" y="78" width="162" height="92" rx="8" fill="#131a30" stroke="#232f4f"/>
      <text x="988" y="96" class="mono" font-size="9.5" fill="#9fb0d0">SUITES / ENV</text>
      <circle cx="1014" cy="130" r="22" fill="none" stroke="#38bdf8" stroke-width="6"/>
      <circle cx="1014" cy="130" r="22" fill="none" stroke="#818cf8" stroke-width="6" stroke-dasharray="92 50" transform="rotate(-90 1014 130)"/>
      <text x="1048" y="126" class="sans" font-size="12" font-weight="700" fill="#ece6da">Win · Mac</text>
      <text x="1048" y="143" class="sans" font-size="11" fill="#7dd3fc">Linux CI</text>

      <text x="632" y="192" class="mono" font-size="9.5" letter-spacing="0.9" fill="#8b9db8">MULTI-SUITE COLLECTION TIMELINE</text>
      <rect x="632" y="201" width="504" height="14" rx="4" fill="#172038"/>
      <rect x="632" y="201" width="44" height="14" rx="4" fill="#a855f7"/>
      <rect x="676" y="201" width="128" height="14" fill="#60a5fa"/>
      <rect x="804" y="201" width="38" height="14" fill="#3dd98f"/>
      <rect x="842" y="201" width="136" height="14" fill="#3b82f6"/>
      <rect x="978" y="201" width="122" height="14" fill="#d97706"/>
      <rect x="1100" y="201" width="36" height="14" rx="4" fill="#10b981"/>

      <line x1="628" y1="236" x2="1138" y2="236" stroke="#222d4a" stroke-width="1"/>
      <rect x="610" y="235" width="150" height="2.2" fill="url(#beam)">
        <animate attributeName="x" values="610;1010;610" dur="5.2s" repeatCount="indefinite"/>
      </rect>

      <rect x="630" y="250" width="506" height="68" rx="9" fill="#11231e" stroke="#3dd98f" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="646" y="274" class="sans" font-size="12.5" font-weight="700" fill="#3dd98f">Actively maintained — bridge bugs &amp; Extent quirks handled</text>
      <text x="646" y="295" class="mono" font-size="10.2" fill="#a7bab3">EXTENT-REPORT/&lt;NAME&gt;_&lt;TS&gt;/INDEX.HTML · EMBEDDED SCREENSHOTS</text>
    </g>
  </g>
  <rect x="16" y="16" width="1168" height="338" rx="18" fill="none" stroke="#c3cce3" stroke-width="1.2"/>
</svg>
