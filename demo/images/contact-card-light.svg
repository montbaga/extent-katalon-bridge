<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="1200" height="232" role="img" aria-label="Contact Monty Bagati — Extent Reports bridge fixes, CI pipelines, and sponsors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f4fb"/>
      <stop offset="60%" stop-color="#e8ecf8"/>
      <stop offset="100%" stop-color="#dfe6f5"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3dd98f" stop-opacity="0"/>
    </linearGradient>
    <mask id="ticketMask">
      <rect x="16" y="16" width="1168" height="200" rx="18" fill="white"/>
      <circle cx="802" cy="16" r="11" fill="black"/>
      <circle cx="802" cy="216" r="11" fill="black"/>
    </mask>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', Times, serif; font-style: italic; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <g mask="url(#ticketMask)">
    <rect x="16" y="16" width="1168" height="200" fill="url(#bg)"/>
    <rect x="16" y="16" width="180" height="3" fill="url(#shimmer)">
      <animate attributeName="x" values="16;1004;16" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="48" y="40" width="318" height="24" rx="12" fill="#11182c"/>
    <circle cx="64" cy="52" r="4" fill="#3dd98f">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="77" y="56" class="mono" font-size="10.5" letter-spacing="1.0" fill="#f2f4fb">DIRECT LINE · ACTIVELY MAINTAINED</text>

    <text x="48" y="102" class="sans" font-size="29" font-weight="700" letter-spacing="-0.6" fill="#0f1526">Need Extent fixes or CI wiring? Let's talk.</text>
    <text x="48" y="136" class="serif" font-size="20.5" fill="#4338ca">extent 5 workarounds · azure / github / gitlab ci · sponsors</text>

    <text x="48" y="170" class="sans" font-size="13.5" fill="#3a455e">Hit an Extent Reports quirk, customizing categories.json, or setting up CI across</text>
    <text x="48" y="190" class="sans" font-size="13.5" fill="#3a455e">Win / macOS / Linux agents? Drop a note — I reply personally.</text>

    <line x1="802" y1="30" x2="802" y2="202" stroke="#bcc5dc" stroke-width="1.5" stroke-dasharray="5 6"/>

    <rect x="832" y="34" width="322" height="164" rx="13" fill="#11182c" stroke="#263152"/>
    <text x="850" y="58" class="mono" font-size="10" letter-spacing="1.0" fill="#9fb0d0">SUPPORT DESK · MONTY BAGATI</text>
    <line x1="850" y1="68" x2="1136" y2="68" stroke="#232f4f"/>

    <rect x="850" y="79" width="286" height="32" rx="7" fill="#172038" stroke="#293558"/>
    <text x="862" y="99" class="mono" font-size="10" fill="#ff7b3b">EMAIL</text>
    <text x="914" y="99" class="sans" font-size="12" font-weight="600" fill="#ece6da">bagati.monty@gmail.com</text>

    <rect x="850" y="118" width="286" height="32" rx="7" fill="#172038" stroke="#293558"/>
    <text x="862" y="138" class="mono" font-size="10" fill="#a5b4fc">LINKEDIN</text>
    <text x="926" y="138" class="sans" font-size="12" font-weight="600" fill="#ece6da">in/monty-bagati-90454626</text>

    <rect x="850" y="157" width="286" height="32" rx="7" fill="#172038" stroke="#293558"/>
    <text x="862" y="177" class="mono" font-size="10" fill="#3dd98f">GITHUB</text>
    <text x="918" y="177" class="sans" font-size="12" font-weight="600" fill="#ece6da">@montbaga · clickable links ↓</text>
  </g>
  <rect x="16" y="16" width="1168" height="200" rx="18" fill="none" stroke="#c3cce3" stroke-width="1.2" mask="url(#ticketMask)"/>
</svg>
